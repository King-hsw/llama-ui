name: Release

# 推送 v* 标签时：构建 → 签名 → 发布 Release（含 latest.json，供应用内自动更新）
# Release 正文取自附注 tag 的注释（git tag -a v1.2.3 -m "更新说明"）；
# 注意 git 会丢弃 # 开头的行（默认注释符），说明文案行首不要用 #，
# 轻量 tag / 手动触发时回退到默认说明
# 也可在 Actions 页面手动触发（workflow_dispatch），用当前代码验证构建流程
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 需要

jobs:
  publish:
    name: Build & publish (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Rust 编译缓存：首次构建约 10-20 分钟，命中缓存后可省一半以上
      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 版本一致性门禁：三处版本必须一致，防止打出错误版本号的安装包
      - name: Verify version consistency
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          CONF_VER=$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")
          echo "package.json = $PKG_VER"
          echo "tauri.conf.json = $CONF_VER"
          if [ "$PKG_VER" != "$CONF_VER" ]; then
            echo "::error::版本不一致: package.json($PKG_VER) != tauri.conf.json($CONF_VER)，请先同步版本号"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            echo "tag = $TAG_VER"
            if [ "$TAG_VER" != "$PKG_VER" ]; then
              echo "::error::tag($TAG_VER) != package.json($PKG_VER)，请先同步版本号再打 tag"
              exit 1
            fi
          fi

      # 提取附注 tag 的注释作为 Release 正文（actions/checkout 默认不拉取 tag 对象，需显式 fetch）；
      # 轻量 tag 或注释为空时回退默认说明，保证 Release 正文永不为空
      - name: Extract release body from tag message
        id: tagmsg
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          OBJTYPE=$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(objecttype)')
          BODY=""
          if [ "$OBJTYPE" = "tag" ]; then
            # 剥离 PGP 签名块（若 tag 被签名），命令替换会同时去掉首尾空行
            BODY=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d')
          fi
          if [ -z "$BODY" ]; then
            BODY="在 Assets 中下载 llama-ui_x.y.z_x64-setup.exe 安装。应用内「设置 → 关于 → 检查应用更新」可自动更新（更新包经签名验证）。"
          fi
          {
            echo "body<<__RELEASE_BODY_EOF__"
            printf '%s\n' "$BODY"
            echo "__RELEASE_BODY_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # tauri-action 一条龙：构建（读取 TAURI_SIGNING_PRIVATE_KEY 对更新包签名，
      # bundle.createUpdaterArtifacts 开启后产物含 .sig）→ 创建 GitHub Release
      # → 上传安装包与 .sig → 生成并上传 latest.json（应用内 updater 的 endpoint）
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "llama-ui v__VERSION__"
          releaseBody: ${{ steps.tagmsg.outputs.body || '在 Assets 中下载 llama-ui_x.y.z_x64-setup.exe 安装。应用内「设置 → 关于 → 检查应用更新」可自动更新（更新包经签名验证）。' }}
          releaseDraft: false
          # 注意：必须为正式 release（prerelease/draft 不计入 releases/latest 端点，
          # 否则应用内 updater 的 latest.json 会 404）。alpha/beta 版本号靠 semver 表达即可
          prerelease: false
