name: Release

# 推送 v* 标签时：构建 → 签名 → 发布 Release（含 latest.json，供应用内自动更新）
# 也可在 Actions 页面手动触发（workflow_dispatch），用当前代码验证构建流程
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 需要

jobs:
  publish:
    name: Build & publish (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Rust 编译缓存：首次构建约 10-20 分钟，命中缓存后可省一半以上
      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 版本一致性门禁：三处版本必须一致，防止打出错误版本号的安装包
      - name: Verify version consistency
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          CONF_VER=$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")
          echo "package.json = $PKG_VER"
          echo "tauri.conf.json = $CONF_VER"
          if [ "$PKG_VER" != "$CONF_VER" ]; then
            echo "::error::版本不一致: package.json($PKG_VER) != tauri.conf.json($CONF_VER)，请先同步版本号"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            echo "tag = $TAG_VER"
            if [ "$TAG_VER" != "$PKG_VER" ]; then
              echo "::error::tag($TAG_VER) != package.json($PKG_VER)，请先同步版本号再打 tag"
              exit 1
            fi
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # tauri-action 一条龙：构建（读取 TAURI_SIGNING_PRIVATE_KEY 对更新包签名，
      # bundle.createUpdaterArtifacts 开启后产物含 .sig）→ 创建 GitHub Release
      # → 上传安装包与 .sig → 生成并上传 latest.json（应用内 updater 的 endpoint）
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "llama-ui v__VERSION__"
          releaseBody: "在 Assets 中下载 llama-ui_x.y.z_x64-setup.exe 安装。应用内「设置 → 关于 → 检查应用更新」可自动更新（更新包经签名验证）。"
          releaseDraft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
