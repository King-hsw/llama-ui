name: Build Windows Installer

on:
  # 推送 v* 标签时：构建 + 自动发布 Release
  push:
    tags:
      - "v*"
  # 手动触发：Actions 页面点 Run workflow，用于日常验证构建
  workflow_dispatch:

permissions:
  contents: write # 发布 Release 需要

jobs:
  build-windows:
    name: Build NSIS installer (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Rust 编译缓存：首次构建约 10-20 分钟，命中缓存后可省一半以上
      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 版本一致性门禁：三处版本必须一致，防止打出错误版本号的安装包
      - name: Verify version consistency
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          CONF_VER=$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")
          echo "package.json = $PKG_VER"
          echo "tauri.conf.json = $CONF_VER"
          if [ "$PKG_VER" != "$CONF_VER" ]; then
            echo "::error::版本不一致: package.json($PKG_VER) != tauri.conf.json($CONF_VER)，请先同步版本号"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            echo "tag = $TAG_VER"
            if [ "$TAG_VER" != "$PKG_VER" ]; then
              echo "::error::tag($TAG_VER) != package.json($PKG_VER)，请先同步版本号再打 tag"
              exit 1
            fi
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Tauri app
        run: npm run tauri build

      # NSIS 安装包 + 绿色版 exe 一起归档
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-ui-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/llama-ui.exe
          if-no-files-found: error
          retention-days: 14

      # 仅 tag 触发时发布 GitHub Release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
          draft: false
